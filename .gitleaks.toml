title = "companion-icon-pack"

[extend]
useDefault = true

[[rules]]
id = "private-network-address"
description = "A private network address (10/8, 172.16/12, 192.168/16, 100.64/10). This repo is public: real device addresses stay out. Use 192.0.2.x in examples."
regex = '''\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d{1,3}\.\d{1,3})\b'''
keywords = ["10.", "172.", "192.168.", "100."]
